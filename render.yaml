services:
  - type: web
    name: naipe-real-backend
    runtime: node
    plan: free
    region: virginia
    rootDir: .
    buildCommand: npx --yes pnpm@11.10.0 --dir shared install --frozen-lockfile --prod=false && npx --yes pnpm@11.10.0 --dir shared build && npx --yes pnpm@11.10.0 --dir backend install --frozen-lockfile --prod=false && npx --yes pnpm@11.10.0 --dir backend build
    startCommand: node backend/dist/main/server.js
    healthCheckPath: /readyz
    buildFilter:
      paths:
        - backend/**
        - shared/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: LOG_LEVEL
        value: info
      - key: MAX_ROOMS
        value: "10"
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
